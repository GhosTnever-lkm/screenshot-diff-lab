name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create ZIP and SHA-256
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="Screenshot-Diff-Lab-${GITHUB_REF_NAME}/" HEAD -o "dist/Screenshot-Diff-Lab-${GITHUB_REF_NAME}.zip"
          cd dist
          sha256sum "Screenshot-Diff-Lab-${GITHUB_REF_NAME}.zip" > "Screenshot-Diff-Lab-${GITHUB_REF_NAME}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
